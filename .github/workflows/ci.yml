name: CI

on:
  pull_request:
  push:
    branches:
      - mobile-parity-review

permissions:
  contents: read

jobs:
  test:
    name: Syntax and automated tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run automated tests
        run: npm test
